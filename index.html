<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ずんだもんバーチャル窓</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd0ef;font-family:system-ui,sans-serif}
#fallback{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;transition:opacity .25s ease}
#ui{position:fixed;top:14px;left:14px;z-index:10;max-width:360px;padding:14px 15px;border-radius:16px;background:#10272ddd;color:#fff;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0004}
#ui h1{font-size:18px;margin:0 0 8px}#status{font-size:13px;margin:7px 0;color:#d5f6d6}
#ui p{font-size:12px;line-height:1.55;margin:7px 0;color:#fff}
button,label.file{border:0;border-radius:10px;padding:8px 10px;margin:3px;background:#b7ef8e;color:#173119;font-weight:700;cursor:pointer;display:inline-block}
button.secondary{background:#38545a;color:#fff}input[type=file]{display:none}
#cam{position:fixed;right:12px;bottom:12px;width:160px;z-index:9;border-radius:12px;display:none;transform:scaleX(-1);opacity:.7}
#hint{position:fixed;bottom:12px;left:14px;z-index:5;color:#fff9;font-size:12px;text-shadow:0 1px 4px #000}
#fallback.status3d{opacity:.18}
#fallback .parallax{transform-origin:50% 55%;transition:transform .05s linear}
@media(max-width:650px){#ui{left:10px;top:10px;max-width:calc(100vw - 20px)}}
</style>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/addons/":"https://esm.sh/three@0.170.0/examples/jsm/","@pixiv/three-vrm":"https://esm.sh/@pixiv/three-vrm@3.4.2?external=three"}}</script>
</head>
<body>
<svg id="fallback" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-label="2D park fallback">
<defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7cc9ef"/><stop offset="1" stop-color="#d9f5ff"/></linearGradient></defs>
<rect width="1200" height="700" fill="url(#sky)"/><circle cx="1020" cy="115" r="62" fill="#fff1a8"/>
<g id="parallax">
<path d="M0 360 Q220 300 430 365 T850 350 T1200 360 V700 H0Z" fill="#7ab95e"/>
<path d="M510 700 L690 700 625 360 575 360Z" fill="#ddc99a"/>
<g fill="#4f9952" stroke="#705138" stroke-width="10">
<path d="M120 360 V190 M80 245 Q120 150 165 245 Q120 220 80 245Z"/>
<path d="M970 360 V180 M915 235 Q970 130 1025 235 Q970 205 915 235Z"/>
<path d="M300 355 V210 M250 260 Q300 165 350 260 Q300 225 250 260Z"/>
<path d="M820 360 V220 M770 270 Q820 175 870 270 Q820 235 770 270Z"/>
</g>
<g transform="translate(560 285)">
<ellipse cx="40" cy="270" rx="70" ry="16" fill="#0002"/>
<g>
<rect x="15" y="118" width="50" height="105" rx="22" fill="#8cdb75"/>
<circle cx="40" cy="85" r="44" fill="#ead6b8"/>
<path d="M12 54 L-18 -25 24 34Z M68 54 L98 -25 56 34Z" fill="#8cdb75"/>
<circle cx="25" cy="84" r="5" fill="#222"/><circle cx="55" cy="84" r="5" fill="#222"/>
<path d="M2 145 Q-55 178 -33 205" fill="none" stroke="#8cdb75" stroke-width="14" stroke-linecap="round"/>
<path d="M78 145 Q135 178 113 205" fill="none" stroke="#8cdb75" stroke-width="14" stroke-linecap="round"/>
</g></g>
<g fill="#9c6a42"><rect x="120" y="535" width="170" height="13" rx="5"/><rect x="135" y="548" width="10" height="52"/><rect x="265" y="548" width="10" height="52"/></g>
</g></svg>

<section id="ui">
<h1>🌱 ずんだもんバーチャル窓</h1>
<div id="status">公園を表示しました。WebGLチェック中…</div>
<label class="file">VRMを読み込む<input id="model" type="file" accept=".vrm"></label>
<label class="file">VMDを読み込む<input id="motion" type="file" accept=".vmd"></label>
<label class="file">🎵 音声を選ぶ<input id="voice" type="file" accept="audio/*"></label>
<button id="speak">🔊 しゃべらせる</button>
<button id="camera">📷 顔追跡を開始</button>
<button id="reset" class="secondary">視点リセット</button>
<p>WebGLが使える環境では3D公園、使えない環境では軽量2D公園を自動使用。カメラ映像と顔検出は端末内で処理します。</p>
</section>
<video id="cam" autoplay muted playsinline></video>
<div id="hint">マウス移動：視点変更　|　ホイール：距離　|　F：全画面</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';
import {parseVMD,createVMDPlayer} from './vmd.js';

const $=id=>document.getElementById(id);
const status=s=>$('status').textContent=s;
const fallback=$('fallback'),parallax=fallback.querySelector('#parallax');

let webglOK=false,renderer=null,camera3D=null,scene=null,vrm=null,motion=null,motionData=null;
let elapsed=0,last=performance.now();
let viewTarget=new THREE.Vector3(),viewSmooth=new THREE.Vector3();
let mouseX=0,mouseY=0,mouseZ=0;

function apply2DView(){
  const sx=-viewSmooth.x*170,sy=viewSmooth.y*90,sc=1+viewSmooth.z*.05;
  parallax.setAttribute('transform',`translate(${sx} ${sy}) scale(${sc}) translate(${(1-sc)*600} ${(1-sc)*350})`);
}
function tryWebGL(){
  try{
    const test=document.createElement('canvas');
    const gl=test.getContext('webgl2',{failIfMajorPerformanceCaveat:false})||test.getContext('webgl',{failIfMajorPerformanceCaveat:false});
    if(!gl)return false;
    renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power',failIfMajorPerformanceCaveat:false});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
    renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
    scene=new THREE.Scene();scene.background=new THREE.Color('#94ccec');scene.fog=new THREE.Fog('#94ccec',25,70);
    camera3D=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.03,120);
    scene.add(new THREE.HemisphereLight('#e7f5ff','#64874e',2));
    const sun=new THREE.DirectionalLight('#fff1bd',2);sun.position.set(-5,10,4);scene.add(sun);
    const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.95});
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat('#79b85d'));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);
    const path=new THREE.Mesh(new THREE.PlaneGeometry(2.4,50),mat('#e2cda1'));path.rotation.x=-Math.PI/2;path.position.set(2.5,.01,-16);scene.add(path);
    const trunk=mat('#785337'),leaves=[mat('#4e9b54'),mat('#6eb75b'),mat('#8ac85b')];
    const sph=new THREE.SphereGeometry(1,8,7);
    function tree(x,z,s){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,2.3,7),trunk);t.position.y=1.15;g.add(t);for(let i=0;i<3;i++){const l=new THREE.Mesh(sph,leaves[(i+x+z+20)|0]%3);l.position.set((i-1)*.45,2.45+(i%2)*.2,0);g.add(l)}g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g)}
    for(let i=0;i<24;i++)tree((i*37%45)-22,-4-(i*19%44),.75+(i%4)*.13);
    const dg=new THREE.Group();dg.position.set(0,0,-3);scene.add(dg);
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.6,4,10),mat('#8cdb75'));body.position.y=.9;dg.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.34,14,10),mat('#ead6b8'));head.position.y=1.68;dg.add(head);
    for(const x of [-.22,.22]){const e=new THREE.Mesh(new THREE.ConeGeometry(.13,.4,7),mat('#8cdb75'));e.position.set(x,2.04,0);e.rotation.z=x>0?-.25:.25;dg.add(e)}
    const eyeMat=mat('#222');for(const x of [-.12,.12]){const e=new THREE.Mesh(new THREE.SphereGeometry(.028,7,7),eyeMat);e.position.set(x,1.7,.32);dg.add(e)}
    window.__dancerGroup=dg;window.__placeholder={body,head,dg};
    webglOK=true;fallback.classList.add('status3d');status('3D公園モードで起動しました 🌱');return true;
  }catch(e){console.warn('3D unavailable:',e);webglOK=false;renderer?.dispose();renderer?.domElement.remove();renderer=null;status('WebGLが使えないので軽量2Dモードで起動しました。公園はそのまま動きます 🌱');return false}
}
function updateProjection(){
 if(!webglOK||!camera3D)return;
 const W=.53,H=W*(innerHeight/innerWidth),z=Math.max(.45,.72+viewSmooth.z),x=viewSmooth.x,y=viewSmooth.y;
 camera3D.projectionMatrix.makePerspective((-W/2-x)*.05/z,(W/2-x)*.05/z,(H/2-y)*.05/z,(-H/2-y)*.05/z,.05,120);
 camera3D.projectionMatrixInverse.copy(camera3D.projectionMatrix).invert();
 camera3D.position.set(x,1.25+y,z);camera3D.rotation.set(0,0,0);
}
async function loadVRM(url){
 if(!webglOK)return;
 try{
  status('VRM読み込み中…');const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));
  const gltf=await loader.loadAsync(url);const next=gltf.userData.vrm;if(!next)throw Error('VRMとして読み込めません');
  if(vrm){window.__dancerGroup.remove(vrm.scene);VRMUtils.deepDispose(vrm.scene)}
  vrm=next;VRMUtils.rotateVRM0(vrm);vrm.scene.traverse(o=>{if(o.isMesh)o.frustumCulled=false});
  window.__dancerGroup.add(vrm.scene);
  if(motionData)motion=createVMDPlayer(vrm,motionData);
  status(motion?'ずんだもん＋YAJU＆Uモーション準備完了！':'ずんだもん登場！');
 }catch(e){console.warn(e);status('VRMはまだ配置されていません。仮キャラで起動中。')}
}
$('model').onchange=async e=>{const f=e.target.files[0];if(f){const u=URL.createObjectURL(f);await loadVRM(u);URL.revokeObjectURL(u)}};
$('motion').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{motionData=parseVMD(await f.arrayBuffer());motion=vrm?createVMDPlayer(vrm,motionData):null;elapsed=0;status('YAJU＆Uモーション読み込み完了！')}catch(err){status('VMD読み込み失敗: '+err.message)}};
fetch('./motions/YAJU-U.vmd',{cache:'force-cache'}).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>{motionData=parseVMD(b);if(vrm)motion=createVMDPlayer(vrm,motionData)}).catch(()=>{});
let voiceUrl=null;const voiceAudio=new Audio();
$('voice').onchange=e=>{const f=e.target.files[0];if(!f)return;if(voiceUrl)URL.revokeObjectURL(voiceUrl);voiceUrl=URL.createObjectURL(f);voiceAudio.src=voiceUrl;status('音声をセット！ 🔊')};
$('speak').onclick=async()=>{try{if(!voiceAudio.src)throw Error();voiceAudio.currentTime=0;await voiceAudio.play();}catch{status('VOICEVOXなどで作った音声ファイルを選んでね')}}();

let tracking=false,tracker=null,stream=null,faceBase=null,lastDetect=0;
async function startCamera(){
 if(tracking){tracking=false;stream?.getTracks().forEach(t=>t.stop());$('cam').style.display='none';$('camera').textContent='📷 顔追跡を開始';status('カメラ停止');return}
 try{
  const media=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:15,max:20}},audio:false});
  stream=media;$('cam').srcObject=stream;await $('cam').play();$('cam').style.display='block';tracking=true;faceBase=null;
  $('camera').textContent='⏹ 顔追跡を停止';status('カメラ起動中。ローカル顔認識エンジンを準備…');
  const engine=await import('./face-engine.js');
  const vision=await engine.FilesetResolver.forVisionTasks('./vendor/mediapipe/');
  const base={modelAssetPath:'./vendor/mediapipe/blaze_face_short_range.tflite'};
  try{tracker=await engine.FaceDetector.createFromOptions(vision,{baseOptions:{...base,delegate:'GPU'},runningMode:'VIDEO',minDetectionConfidence:.5})}
  catch{tracker=await engine.FaceDetector.createFromOptions(vision,{baseOptions:{...base,delegate:'CPU'},runningMode:'VIDEO',minDetectionConfidence:.5})}
  status('顔追跡中！ 軽量ローカルモード 🌱');
 }catch(e){
  console.error(e);tracking=false;stream?.getTracks().forEach(t=>t.stop());$('cam').style.display='none';$('camera').textContent='📷 顔追跡を開始';
  status('カメラは起動しましたが、顔認識エンジンの準備に失敗: '+e.message);
 }
}
$('camera').onclick=startCamera;
function detectFace(now){
 if(!tracking||!tracker||$('cam').readyState<2||now-lastDetect<80)return;lastDetect=now;
 try{const res=tracker.detectForVideo($('cam'),now),d=res.detections?.[0],b=d?.boundingBox;if(!b)return;
  const vw=$('cam').videoWidth||320,vh=$('cam').videoHeight||240;
  const cx=(b.originX+b.width/2)/vw,cy=(b.originY+b.height/2)/vh,size=Math.min(b.width/vw,b.height/vh);
  if(size<.03)return;
  if(!faceBase)faceBase={cx,cy,size};
  const nextX=THREE.MathUtils.clamp((faceBase.cx-cx)*.9,-.32,.32);
  const nextY=THREE.MathUtils.clamp((faceBase.cy-cy)*.7,-.25,.25);
  const nextZ=THREE.MathUtils.clamp((faceBase.size/size-1)*.65,-.25,.7);
  viewTarget.set(nextX,nextY,nextZ);
 }catch(e){console.warn(e)}
}
$('reset').onclick=()=>{mouseX=mouseY=mouseZ=0;viewTarget.set(0,0,0);faceBase=null};
addEventListener('pointermove',e=>{if(!tracking){mouseX=(e.clientX/innerWidth-.5)*.55;mouseY=(.5-e.clientY/innerHeight)*.35}});
addEventListener('wheel',e=>{if(!tracking)mouseZ=THREE.MathUtils.clamp(mouseZ+e.deltaY*.0005,-.25,.7)},{passive:true});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;detectFace(now);
 if(!tracking)viewTarget.set(mouseX,mouseY,mouseZ);
 viewSmooth.lerp(viewTarget,1-Math.exp(-dt*9));apply2DView();
 if(webglOK&&renderer&&camera3D&&scene){
  updateProjection();
  const dg=window.__dancerGroup,ph=window.__placeholder;
  if(motion&&vrm){dg.position.y=0;dg.rotation.y=0;motion(elapsed)}
  else if(dg){const beat=elapsed*3.2;dg.position.y=Math.abs(Math.sin(beat))*.055;dg.rotation.y=Math.sin(beat*.5)*.14;if(ph){ph.body.rotation.z=Math.sin(beat)*.08;ph.head.rotation.z=Math.sin(beat+.8)*.09}}
  if(vrm)vrm.update?.(dt);
  renderer.render(scene,camera3D);
 }
}
addEventListener('resize',()=>{if(renderer)renderer.setSize(innerWidth,innerHeight);updateProjection()});
tryWebGL();if(webglOK)loadVRM('./models/Zundamon.vrm');
requestAnimationFrame(animate);
</script>
</body></html>
