name: Build local face tracker
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'face-entry.js'
      - 'package.json'
      - 'scripts/build.mjs'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build local JS and WASM
        run: npm run build
      - name: Download tiny BlazeFace model
        run: |
          mkdir -p vendor/mediapipe
          curl --fail --location --retry 3 --output vendor/mediapipe/blaze_face_short_range.tflite https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite
          test -s vendor/mediapipe/blaze_face_short_range.tflite
      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add face-engine.js vendor/mediapipe
          if ! git diff --cached --quiet; then
            git commit -m "Build local lightweight face tracker [skip ci]"
            git push
          fi
